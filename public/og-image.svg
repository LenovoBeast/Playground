<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)" opacity="0.9"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0H0V60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Center content -->
  <text x="600" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-2" style="font-variant-caps: all-small-caps;">
    NEXUS<span style="fill:#a855f7">.</span>
  </text>
  <text x="600" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="url(#textGrad)" letter-spacing="-1">
    DIGITAL FRONTIERS
  </text>
  <text x="600" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" letter-spacing="4" style="text-transform: uppercase;">
    Senior Game Dev & Web Engineer
  </text>
  <!-- Decorative orbs -->
  <circle cx="200" cy="150" r="120" fill="#a855f7" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="100" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="500" r="80" fill="#3b82f6" opacity="0.06" filter="url(#glow)"/>
  <circle cx="1100" cy="130" r="90" fill="#ec4899" opacity="0.06" filter="url(#glow)"/>
</svg>