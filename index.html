<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark light" />

    <!-- Primary metadata -->
    <title>Lenovo Beast — Game Dev & Web Engineer</title>
    <meta name="description" content="Senior Game Dev & Web Engineer. High-performance engines, immersive web experiences, developer tooling. React, Three.js, WebGPU, Rust/Wasm." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lenovo Beast — Game Dev & Web Engineer" />
    <meta property="og:description" content="Senior Game Dev & Web Engineer. High-performance engines, immersive web experiences, developer tooling." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="/Playground/" />
    <meta property="og:site_name" content="Lenovo Beast Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lenovo Beast — Game Dev & Web Engineer" />
    <meta name="twitter:description" content="Senior Game Dev & Web Engineer. High-performance engines, immersive web experiences, developer tooling." />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- PWA / App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lenovo Beast" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />

    <!-- Structured data: Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Lenovo Beast",
      "url": "/Playground/",
      "image": "/og-image.svg",
      "sameAs": [
        "https://github.com/LenovoBeast",
        "https://twitter.com/LenovoBeast",
        "https://linkedin.com/in/lenovobeast"
      ],
      "jobTitle": "Senior Game Developer & Web Engineer",
      "description": "Senior Game Dev & Web Engineer architecting high-performance engines, immersive web experiences, and developer tooling.",
      "knowsAbout": ["React", "Three.js", "WebGPU", "Rust", "Wasm", "TypeScript", "GSAP", "Game Development", "WebGL"],
      "alumniOf": { "@type": "Organization", "name": "Self-employed" }
    }
    </script>

    <!-- Structured data: SoftwareSourceCode (this portfolio) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareSourceCode",
      "name": "Lenovo Beast Portfolio",
      "description": "Interactive portfolio website built with React, Three.js, GSAP, and Tailwind CSS",
      "url": "/Playground/",
      "dateCreated": "2024",
      "programmingLanguage": ["JavaScript", "TypeScript", "HTML", "CSS"],
      "author": { "@type": "Person", "name": "Lenovo Beast" },
      "softwareRequirements": "Modern browser with WebGL support"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:4rem;font-family:system-ui;color:#e2e8f0;background:#030712;text-align:center">
        This portfolio requires JavaScript for its interactive 3D experience. Please enable JavaScript.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
