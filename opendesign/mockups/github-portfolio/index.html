<!doctype html>
<title>GitHub Projects Showcase</title>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />

<body>
  <header class="hero">
    <h1 class="headline">My Web Lab</h1>
    <p class="subhead">A warm, playful, professional collection of projects & tools</p>
    <!-- Animated illustration placeholder -->
    <svg class="hero-illustration" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="90" fill="var(--accent)" />
      <path d="M60 80 L100 140 L140 80" fill="none" stroke="var(--bg)" stroke-width="8" stroke-linecap="round" />
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite" />
    </svg>
  </header>

  <main class="projects">
    <!-- Project cards will be injected via JSON placeholder -->
    <section class="card" data-index="0">
      <h2 class="project-title">Project One</h2>
      <p class="project-desc">A brief description of the project’s purpose and tech stack.</p>
      <a class="project-link" href="#" target="_blank">Visit Demo →</a>
    </section>
    <section class="card" data-index="1">
      <h2 class="project-title">Project Two</h2>
      <p class="project-desc">Another compelling tool that solves a niche problem.</p>
      <a class="project-link" href="#" target="_blank">View Code →</a>
    </section>
    <!-- Add more cards as needed -->
  </main>
</body>
