# Netlify Configuration for Nexus. Portfolio
[build]
  command = "npm run build"
  publish = "dist"

# SPA redirect - all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # Content-Security-Policy
    # - script-src: self + sha256 hashes of the two inline JSON-LD blocks in
    #   index.html (regenerate with `node scripts/csp-hashes.mjs` after any
    #   JSON-LD edit, and re-check after `vite build` in case the build starts
    #   emitting inline scripts).
    # - style-src needs 'unsafe-inline' because React inline style attributes
    #   cannot be hashed. Fonts and thumbnails are self-hosted, so no external
    #   style/font/image origins are needed.
    # - img-src allows data: URIs (noise texture).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-fQTvSrsvyCZPMXAxH4RM2OxXNpJZWWDjD37lPi+5Ygc=' 'sha256-H7xrnPiBmLS3cm2PrPLtzioPPste+fpGXAOl+j3JIuM='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache sitemap and robots
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Cache OG image
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Environment variables (set in Netlify dashboard)
# VITE_SITE_URL = "https://lenovobeast.github.io/Playground/"

# Build environment
[build.environment]
  NODE_VERSION = "22"

# Functions (if needed later)
# [functions]
#   directory = "netlify/functions"