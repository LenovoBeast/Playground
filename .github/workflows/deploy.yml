name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Build
        run: npm run build

      - name: Start production preview
        run: npm run preview -- --host 127.0.0.1 > /tmp/playground-preview.log 2>&1 &

      - name: Capture preview frames
        run: npm run capture:preview

      - name: Encode preview GIF and MP4
        run: |
          ffmpeg -y -framerate 12 -i .preview-frames/frame-%03d.png -vf 'fps=12,scale=960:-1:flags=lanczos' dist/preview.gif
          ffmpeg -y -framerate 12 -i .preview-frames/frame-%03d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart dist/preview.mp4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload preview files
        uses: actions/upload-artifact@v4
        with:
          name: website-preview-media
          path: |
            dist/preview.gif
            dist/preview.mp4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
